<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NKOTEN PS4</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d10;
        color: #e6ebf2;
        font:
          15px/1.45 'Segoe UI',
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* ===== Sidebar (mesmo padrão da home) ===== */
      #sidebar {
        width: 230px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #0e1116 0%, #08090c 100%);
        border-right: 1px solid #141920;
        display: flex;
        flex-direction: column;
        padding: 28px 0 18px;
        position: relative;
        z-index: 10;
      }
      #sidebar::after {
        content: '';
        position: absolute;
        top: 0;
        right: -1px;
        bottom: 0;
        width: 1px;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(255, 106, 0, 0.35),
          transparent
        );
      }
      #logo {
        text-align: center;
        padding: 0 16px 18px;
      }
      #logo img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: block;
        margin: 0 auto 12px;
        border: 2px solid #ff6a00;
        box-shadow: 0 0 22px rgba(255, 106, 0, 0.35);
        transition: transform 0.35s ease;
      }
      #logo img:hover {
        transform: scale(1.05);
      }
      #logo b {
        display: block;
        font-size: 11px;
        letter-spacing: 0.28em;
        color: #e6ebf2;
        font-weight: 800;
        line-height: 1.45;
      }
      #logo b span {
        color: #ff6a00;
      }

      #lang {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 0 16px 18px;
      }
      .lang-btn {
        padding: 6px 13px;
        font:
          11px/1 'Segoe UI',
          sans-serif;
        letter-spacing: 0.14em;
        color: #6c7686;
        background: #141920;
        border: 1px solid #1a1f27;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        font-weight: 700;
        font-family: inherit;
        outline: none;
      }
      .lang-btn:hover {
        color: #e6ebf2;
        border-color: #2a3140;
      }
      .lang-btn.active {
        color: #fff;
        background: linear-gradient(180deg, #ff7a10, #d94f00);
        border-color: #ff6a00;
        box-shadow: 0 0 12px rgba(255, 106, 0, 0.4);
      }

      #nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 0 14px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        color: #8b95a3;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.22s ease;
        font-size: 15px;
        font-weight: 500;
        border: 2px solid transparent;
        outline: none;
        background: transparent;
        font-family: inherit;
        text-align: left;
        width: 100%;
        position: relative;
        text-decoration: none;
      }
      .nav-item:hover {
        color: #e6ebf2;
        background: #141920;
      }
      .nav-item.active,
      .nav-item:focus {
        color: #fff;
        background: linear-gradient(
          90deg,
          rgba(255, 106, 0, 0.2),
          rgba(255, 106, 0, 0.03)
        );
        border-color: #ff6a00;
        box-shadow:
          0 0 0 1px rgba(255, 106, 0, 0.4),
          0 4px 20px rgba(255, 106, 0, 0.15);
      }
      .nav-item.active::before {
        content: '';
        position: absolute;
        left: -14px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 22px;
        background: #ff6a00;
        border-radius: 0 3px 3px 0;
      }
      .nav-item svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      #side-bottom {
        padding: 14px 14px 0;
        border-top: 1px solid #141920;
        margin-top: 14px;
      }

      /* ===== Content ===== */
      #content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 60px;
      }
      .view {
        width: 100%;
        max-width: 680px;
        animation: fadeUp 0.55s ease;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .step-tag {
        display: inline-block;
        padding: 6px 14px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ff8a3c;
        background: rgba(255, 106, 0, 0.1);
        border: 1px solid rgba(255, 106, 0, 0.35);
        border-radius: 20px;
        margin-bottom: 20px;
      }

      /* #state — o JS original aplica className direto: usar seletores #state.X */
      #state {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1.12;
        margin: 0 0 14px;
        color: #e6ebf2;
        transition: color 0.3s ease;
      }
      #state.ok {
        color: #7fd0a0;
      }
      #state.bad {
        color: #d08a7f;
      }
      #state.warn {
        color: #d8c07f;
      }

      #det {
        font-size: 15px;
        color: #8b95a3;
        margin: 0 0 14px;
        line-height: 1.6;
      }
      #det b {
        color: #c8ced8;
        font-weight: 600;
      }

      #cache {
        font-size: 12px;
        color: #5c6672;
        letter-spacing: 0.08em;
        margin: 0;
        min-height: 16px;
        transition: color 0.25s ease;
      }
      #cache.cacheok {
        color: #7fd0a0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="logo">
          <img src="Logo.png" alt="Logo" />
          <b>NKOTEN<br /><span>PS4</span></b>
        </div>
        <div id="lang">
          <button class="lang-btn" data-lang="pt" type="button">PT</button>
          <button class="lang-btn" data-lang="en" type="button">EN</button>
        </div>
        <nav id="nav">
          <a class="nav-item" href="index.html">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z"
              />
            </svg>
            <span>Home</span>
          </a>
          <a class="nav-item active" href="install.html">
            <svg viewBox="0 0 24 24">
              <path d="M7 11V7a5 5 0 0 1 9.9-1" />
              <rect x="3" y="11" width="18" height="10" rx="2" />
            </svg>
            <span>Desbloqueio</span>
          </a>
          <a class="nav-item" href="index.html">
            <svg viewBox="0 0 24 24">
              <path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z" />
              <path d="M18 7h2v13a3 3 0 0 1-3 3" />
              <path d="M8 9h6M8 13h6" />
            </svg>
            <span>Tutoriais</span>
          </a>
        </nav>
        <div id="side-bottom">
          <a class="nav-item" href="index.html">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            <span>Configurações</span>
          </a>
        </div>
      </aside>

      <main id="content">
        <div class="view">
          <span class="step-tag">Desbloqueio · Passo 1 de 2</span>
          <h1 id="state">detectando firmware...</h1>
          <p id="det"></p>
          <p id="cache"></p>
        </div>
      </main>
    </div>

    <script>
      (function () {
        var stateEl = document.getElementById('state');
        var detEl = document.getElementById('det');
        var cacheEl = document.getElementById('cache');
        function setState(t, c) {
          stateEl.textContent = t;
          stateEl.className = c || '';
        }
        function setCache(t, ok) {
          cacheEl.textContent = t;
          cacheEl.className = ok ? 'cacheok' : '';
        }
        var params = new URLSearchParams(location.search);

        // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
        // own kernel-table-present gate, so this is UX only -- an unlisted firmware
        // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
        // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
        // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
        var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

        var key = null,
          fwnum = null;
        var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
          var ms = parseInt(m[2], 16).toString(16);
          if (ms.length < 2) ms = '0' + ms;
          key = m[1] + '.' + ms;
          fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }

        var forced = params.get('force') === '1';
        var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
        detEl.innerHTML =
          'firmware <b>' +
          (key || 'unknown') +
          '</b>' +
          (supported
            ? ' &middot; <b>supported</b>'
            : " &middot; not in this build's kernel table");

        var target = 'jb.html' + location.search;
        function go() {
          setState('loading jailbreak...', 'warn');
          location.replace(target);
        }

        function waitForTap(msg, action) {
          setState(msg, 'warn');
          function fire() {
            window.removeEventListener('click', fire);
            window.removeEventListener('keydown', fire);
            action();
          }
          window.addEventListener('click', fire);
          window.addEventListener('keydown', fire);
        }

        // Off-target consoles are not launched automatically -- one tap still runs
        // it, so a user-agent quirk on the real 13.52 console can never lock it out.
        if (!supported) {
          setState('NÃO COMPATIVEL COM ESSA FIRMWARE', 'bad');
          waitForTap(
            'NÃO SUPORTA (' +
              (key || 'unknown') +
              ') -- APERTE  X PARA COMEÇAR ',
            go,
          );
          return;
        }

        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute('manifest')) {
          go();
        } else if (!navigator.onLine) {
          setCache('offline -- from cache', true);
          go();
        } else if (ac.status === ac.IDLE) {
          setCache('cached', true);
          go();
        } else if (ac.status === ac.UPDATEREADY) {
          try {
            ac.swapCache();
          } catch (e) {}
          setCache('update downloaded', true);
          waitForTap(
            'UPDATE READY -- press X or tap to reload & run',
            function () {
              location.reload();
            },
          );
        } else {
          setCache('checking cache...');
          ac.addEventListener(
            'downloading',
            function () {
              setCache('caching for offline (first run)...');
            },
            false,
          );
          ac.addEventListener(
            'progress',
            function (e) {
              if (e && e.total)
                setCache(
                  'caching ' + Math.round((e.loaded / e.total) * 100) + '%',
                );
            },
            false,
          );
          ac.addEventListener(
            'cached',
            function () {
              setCache('cached for offline use', true);
              waitForTap('CACHED (first run) -- press X or tap to run', go);
            },
            false,
          );
          ac.addEventListener(
            'updateready',
            function () {
              try {
                ac.swapCache();
              } catch (e) {}
              setCache('update downloaded', true);
              waitForTap(
                'UPDATE READY -- press X or tap to reload & run',
                function () {
                  location.reload();
                },
              );
            },
            false,
          );
          ac.addEventListener(
            'noupdate',
            function () {
              setCache('cached -- offline ready', true);
              go();
            },
            false,
          );
          ac.addEventListener(
            'error',
            function () {
              setCache('cache unavailable');
              waitForTap('CACHE FAILED -- press X or tap to run anyway', go);
            },
            false,
          );
          ac.addEventListener(
            'obsolete',
            function () {
              setCache('cache obsolete');
              waitForTap('CACHE OBSOLETE -- press X or tap to run', go);
            },
            false,
          );
        }
      })();
    </script>

    <!-- Helper isolado p/ PT/EN visual. NÃO interfere no script acima. -->
    <script>
      (function () {
        var L = 'pt';
        try {
          var s = localStorage.getItem('nr_lang');
          if (s === 'pt' || s === 'en') L = s;
        } catch (e) {}
        var btns = document.querySelectorAll('.lang-btn');
        function mark() {
          for (var i = 0; i < btns.length; i++)
            btns[i].className =
              'lang-btn' +
              (btns[i].getAttribute('data-lang') === L ? ' active' : '');
        }
        for (var i = 0; i < btns.length; i++)
          (function (b) {
            b.addEventListener('click', function () {
              L = b.getAttribute('data-lang');
              try {
                localStorage.setItem('nr_lang', L);
              } catch (e) {}
              mark();
            });
          })(btns[i]);
        mark();
      })();
    </script>
  </body>
</html>
