<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NKOTEN PS4</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d10;
        color: #e6ebf2;
        font:
          15px/1.45 'Segoe UI',
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* ===== Sidebar ===== */
      #sidebar {
        width: 230px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #0e1116 0%, #08090c 100%);
        border-right: 1px solid #141920;
        display: flex;
        flex-direction: column;
        padding: 28px 0 18px;
        position: relative;
        z-index: 10;
      }
      #sidebar::after {
        content: '';
        position: absolute;
        top: 0;
        right: -1px;
        bottom: 0;
        width: 1px;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(255, 106, 0, 0.35),
          transparent
        );
      }
      #logo {
        text-align: center;
        padding: 0 16px 18px;
      }
      #logo img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: block;
        margin: 0 auto 12px;
        border: 2px solid #ff6a00;
        box-shadow: 0 0 22px rgba(255, 106, 0, 0.35);
        transition: transform 0.35s ease;
      }
      #logo img:hover {
        transform: scale(1.05);
      }
      #logo b {
        display: block;
        font-size: 11px;
        letter-spacing: 0.28em;
        color: #e6ebf2;
        font-weight: 800;
        line-height: 1.45;
      }
      #logo b span {
        color: #ff6a00;
      }

      #lang {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 0 16px 18px;
      }
      .lang-btn {
        padding: 6px 13px;
        font:
          11px/1 'Segoe UI',
          sans-serif;
        letter-spacing: 0.14em;
        color: #6c7686;
        background: #141920;
        border: 1px solid #1a1f27;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        font-weight: 700;
        font-family: inherit;
        outline: none;
      }
      .lang-btn:hover {
        color: #e6ebf2;
        border-color: #2a3140;
      }
      .lang-btn.active {
        color: #fff;
        background: linear-gradient(180deg, #ff7a10, #d94f00);
        border-color: #ff6a00;
        box-shadow: 0 0 12px rgba(255, 106, 0, 0.4);
      }

      #nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 0 14px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        color: #8b95a3;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.22s ease;
        font-size: 15px;
        font-weight: 500;
        border: 2px solid transparent;
        outline: none;
        background: transparent;
        font-family: inherit;
        text-align: left;
        width: 100%;
        position: relative;
        text-decoration: none;
      }
      .nav-item:hover {
        color: #e6ebf2;
        background: #141920;
      }
      .nav-item.active,
      .nav-item:focus {
        color: #fff;
        background: linear-gradient(
          90deg,
          rgba(255, 106, 0, 0.2),
          rgba(255, 106, 0, 0.03)
        );
        border-color: #ff6a00;
        box-shadow:
          0 0 0 1px rgba(255, 106, 0, 0.4),
          0 4px 20px rgba(255, 106, 0, 0.15);
      }
      .nav-item.active::before {
        content: '';
        position: absolute;
        left: -14px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 22px;
        background: #ff6a00;
        border-radius: 0 3px 3px 0;
      }
      .nav-item svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      #side-bottom {
        padding: 14px 14px 0;
        border-top: 1px solid #141920;
        margin-top: 14px;
      }

      /* ===== Content ===== */
      #content {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #warn {
        flex-shrink: 0;
        padding: 14px 20px;
        background: #3a0f10;
        color: #ffdede;
        border-bottom: 2px solid #a5202a;
        text-align: center;
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.35;
        text-shadow: 0 0 6px rgba(255, 60, 60, 0.45);
        animation: warnpulse 1.6s ease-in-out infinite;
      }
      #warn b {
        color: #ff5666;
        font-size: 16px;
      }
      @keyframes warnpulse {
        0%,
        100% {
          background: #3a0f10;
        }
        50% {
          background: #5a1418;
        }
      }

      /* Área central — grid com uma célula (spin/msg/wrap sobrepostos) */
      #stage {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 40px 60px;
        overflow: hidden;
        position: relative;
      }
      #stage > * {
        grid-area: 1/1;
      }

      #spin {
        width: 56px;
        height: 56px;
        border: 5px solid rgba(255, 106, 0, 0.18);
        border-top-color: #ff6a00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 30px rgba(255, 106, 0, 0.25);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        display: none;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        color: #e6ebf2;
        letter-spacing: 0.02em;
        padding: 0 20px;
        line-height: 1.5;
      }

      #wrap {
        display: none;
        width: 100%;
        max-width: 900px;
      }
      #state {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 14px;
        color: #ff8a3c;
        letter-spacing: -0.3px;
      }
      #out {
        white-space: pre-wrap;
        font:
          12px/1.5 Consolas,
          monospace;
        background: #0e1116;
        border: 1px solid #1a1f27;
        border-radius: 10px;
        padding: 14px 16px;
        max-height: calc(100vh - 240px);
        overflow-y: auto;
        color: #c8ced8;
      }
      #out .ok {
        color: #7fd0a0;
      }
      #out .bad {
        color: #d08a7f;
      }
      #out .warn {
        color: #d8c07f;
      }
      #out .safe {
        color: #7fd0a0;
      }
      #out .danger {
        color: #d08a7f;
      }
      #out code {
        color: #9fb3d0;
      }

      /* Estados controlados pelo jb.js via classes de body.
     Preserva exatamente a semântica original:
       default   -> #spin visível
       body.done -> #spin oculto
       body.fail -> #spin oculto + #msg visível
       body.log  -> #spin, #msg ocultos, #wrap visível */
      body.done #spin,
      body.fail #spin,
      body.log #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
      }
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        display: block;
      }

      /* Elementos originais preservados no DOM mas visualmente inativos:
     o novo layout já tem branding no sidebar. */
      #brand,
      #foot {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- Elementos originais mantidos no DOM (para o jb.js se referenciar) -->
    <div id="brand">
      <img
        src="Logo.png"
        alt=""
        style="width: 28px; height: 28px; border-radius: 50%"
      />
      <b>NKOTEN PS4</b>
    </div>

    <div id="app">
      <aside id="sidebar">
        <div id="logo">
          <img src="Logo.png" alt="Logo" />
          <b>NKOTEN<br /><span>PS4</span></b>
        </div>
        <div id="lang">
          <button class="lang-btn" data-lang="pt" type="button">PT</button>
          <button class="lang-btn" data-lang="en" type="button">EN</button>
        </div>
        <nav id="nav">
          <a class="nav-item" href="index.html">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z"
              />
            </svg>
            <span>Home</span>
          </a>
          <a class="nav-item active" href="install.html">
            <svg viewBox="0 0 24 24">
              <path d="M7 11V7a5 5 0 0 1 9.9-1" />
              <rect x="3" y="11" width="18" height="10" rx="2" />
            </svg>
            <span>Desbloqueio</span>
          </a>
          <a class="nav-item" href="index.html">
            <svg viewBox="0 0 24 24">
              <path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z" />
              <path d="M18 7h2v13a3 3 0 0 1-3 3" />
              <path d="M8 9h6M8 13h6" />
            </svg>
            <span>Tutoriais</span>
          </a>
        </nav>
        <div id="side-bottom">
          <a class="nav-item" href="index.html">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            <span>Configurações</span>
          </a>
        </div>
      </aside>

      <main id="content">
        <div id="warn">
          ⚠ GOLDHEN PARA VERSÕES <b>11.00 ATÉ 13.52</b> ATENÇÃO ⚠
        </div>

        <div id="stage">
          <div id="spin"></div>
          <div id="msg">Reinicie seu ps4</div>
          <div id="wrap">
            <div id="state"></div>
            <div id="out"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import './jb.js?v=10';
    </script>

    <!-- Helper isolado p/ PT/EN visual. -->
    <script>
      (function () {
        var L = 'pt';
        try {
          var s = localStorage.getItem('nr_lang');
          if (s === 'pt' || s === 'en') L = s;
        } catch (e) {}
        var btns = document.querySelectorAll('.lang-btn');
        function mark() {
          for (var i = 0; i < btns.length; i++)
            btns[i].className =
              'lang-btn' +
              (btns[i].getAttribute('data-lang') === L ? ' active' : '');
        }
        for (var i = 0; i < btns.length; i++)
          (function (b) {
            b.addEventListener('click', function () {
              L = b.getAttribute('data-lang');
              try {
                localStorage.setItem('nr_lang', L);
              } catch (e) {}
              mark();
            });
          })(btns[i]);
        mark();
      })();
    </script>
  </body>
</html>
